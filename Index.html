  .ctlbtn:hover{background:#4a6fd8}

<div class="hint">click a node to expand / collapse · scroll or pinch to zoom · drag to pan</div>

["Entertainment and commentary",2,7,"high",[["Video essays and analysis",["Film theory","Cultural criticism","Long-form arguments"]],["Movie and series breakdowns",["Easter eggs","Endings explained","Franchise recaps"]],["Reaction and review",["First watch","Rankings","Tier lists"]],["Comedy and sketch",["Parody","Character bits","Improv","Memes"]],["Anime and manga",["Recaps","Power scaling","Seasonal picks"]],["Music commentary",["Album reviews","Production breakdowns","Artist history"]],["Pop culture and internet",["Creator news","Timeline explainers","Deep dives"]]]],
["Kids and family",1,5,"high",[["Nursery rhymes and songs",["Classic rhymes","Original songs","Sing-alongs"]],["Bedtime and moral stories",["Fables","Folk tales","Calm narration"]],["Early learning",["Alphabet","Numbers","Colours","Phonics"]],["Kids science and curiosity",["Simple experiments","Why questions","Nature for children"]],["Toys and play",["Unboxing","Pretend play","Build-alongs"]],["Parenting advice",["Newborn care","Sleep training","Discipline","Dads"]],["Pregnancy and postpartum",["Week by week","Birth prep","Recovery"]]]]

const compColor={low:"#3fb37f",med:"#e0a13a",high:"#d8607a"};
const famColor="#4f7fe0";
const rootColor="#4fb8d8";
const leafColor="#8a5fd8";

function buildData(){
  return {
    name:"YouTube",
    depth:0,
    children:RAW.map(f=>({
      name:f[0],
      cpmLo:f[1],cpmHi:f[2],comp:f[3],
      depth:1,
      children:f[4].map(s=>({
        name:s[0],
        depth:2,
        children:s[1].map(m=>({name:m,depth:3}))
      }))
    }))
  };
}

let i=0;
const root=d3.hierarchy(buildData());
root.x0=0;root.y0=0;
root.children.forEach(collapseChildren);
function collapseChildren(d){
  if(d.children){d._children=d.children;d._children.forEach(collapseChildren);d.children=null;}
}

const svg=d3.select("svg");
const gZoom=svg.append("g");
const gLinks=gZoom.append("g").attr("fill","none");
const gNodes=gZoom.append("g");

const zoom=d3.zoom().scaleExtent([0.15,3]).on("zoom",e=>gZoom.attr("transform",e.transform));
svg.call(zoom);

const dx=175, dy=120;
const treeLayout=d3.tree().nodeSize([dx,dy]);

function nodeColor(d){
  if(d.depth===0)return rootColor;
  if(d.depth===1)return famColor;
  if(d.depth===2)return compColor[d.data.comp?d.data.comp:(d.parent&&d.parent.data.comp)||"med"]||famColor;
  return leafColor;
}
function nodeRadius(d){return d.depth===0?13:d.depth===1?11:d.depth===2?8:6;}

function update(source){
  const nodes=root.descendants();
  const links=root.links();
  treeLayout(root);

  const t=svg.transition().duration(400);

  const node=gNodes.selectAll("g.node").data(nodes,d=>d.id||(d.id=++i));
  const nodeEnter=node.enter().append("g")
    .attr("class","node")
    .attr("transform",`translate(${source.x0},${source.y0})`)
    .on("click",(event,d)=>{
      if(d.children){d._children=d.children;d.children=null;}
      else{d.children=d._children;d._children=null;}
      update(d);
    });

  nodeEnter.append("circle")
    .attr("r",1e-6)
    .attr("fill",d=>d._children?nodeColor(d):(d.children?nodeColor(d):"#1b1e27"))
    .attr("stroke",d=>nodeColor(d));

  nodeEnter.append("text")
    .attr("y",d=>nodeRadius(d)+13)
    .attr("text-anchor","middle")
    .text(d=>d.data.name+(d.depth===1&&d.data.cpmLo?` $${d.data.cpmLo}-${d.data.cpmHi}`:""));

  const nodeUpdate=node.merge(nodeEnter);
  nodeUpdate.transition(t).attr("transform",d=>`translate(${d.x},${d.y})`);
  nodeUpdate.select("circle").transition(t)
    .attr("r",d=>nodeRadius(d))
    .attr("fill",d=>d._children?nodeColor(d):(d.children?nodeColor(d):"#1b1e27"));

  node.exit().transition(t).remove()
    .attr("transform",d=>`translate(${source.x},${source.y})`)
    .select("circle").attr("r",1e-6);

  const link=gLinks.selectAll("path.link").data(links,d=>d.target.id);
  const linkEnter=link.enter().append("path")
    .attr("class","link")
    .attr("stroke",d=>nodeColor(d.target))
    .attr("stroke-opacity",0.55)
    .attr("d",()=>{
      const o={x:source.x0,y:source.y0};
      return diagonal(o,o);
    });

  link.merge(linkEnter).transition(t)
    .attr("d",d=>diagonal(d.source,d.target));

  link.exit().transition(t).remove()
    .attr("d",()=>{
      const o={x:source.x,y:source.y};
      return diagonal(o,o);
    });

  root.eachBefore(d=>{d.x0=d.x;d.y0=d.y;});
}

function diagonal(s,t){
  return `M${s.x},${s.y} C${s.x},${(s.y+t.y)/2} ${t.x},${(s.y+t.y)/2} ${t.x},${t.y}`;
}

function fitToScreen(){
  const nodes=root.descendants();
  let minX=Infinity,maxX=-Infinity,maxY=-Infinity;
  nodes.forEach(d=>{
    if(d.x<minX)minX=d.x;
    if(d.x>maxX)maxX=d.x;
    if(d.y>maxY)maxY=d.y;
  });
  const svgNode=svg.node();
  const w=svgNode.clientWidth,h=svgNode.clientHeight;
  const pad=60;
  const contentW=(maxX-minX)+pad*2;
  const contentH=maxY+120;
  const scale=Math.max(0.3,Math.min((w-pad*2)/contentW,(h-pad*2)/contentH,1.1));
  const tx=w/2-((minX+maxX)/2)*scale;
  const ty=50;
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(tx,ty).scale(scale));
}
window.addEventListener("resize",fitToScreen);

document.getElementById("home").onclick=fitToScreen;
document.getElementById("zin").onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1.35);
document.getElementById("zout").onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.35);

update(root);
fitToScreen();
</script>
